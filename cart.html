<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | FOOTBALL 90</title>
    <meta name="description" content="Football 90 shopping cart." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="topbar">
        <div class="container">
          <span>Free shipping over ₱3,500</span>
          <span>World Cup 2026 Collection</span>
        </div>
      </div>
      <div class="container nav-wrap">
        <a href="index.html" class="logo" aria-label="Football 90 home">
          <img class="logo-image" src="assets/images/logo/football90-logo.png" alt="" />
          <span>FOOTBALL 90</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">HOME</a>
          <a href="shop.html">JERSEYS</a>
          <a href="worldcup.html">WORLD CUP</a>
          <a href="clubs.html">CLUBS</a>
          <a href="national-teams.html">NATIONAL TEAMS</a>
          <a href="shop.html?new=1">NEW ARRIVALS</a>
          <a href="account.html" class="mobile-nav-account">ACCOUNT</a>
        </nav>
        <div class="nav-tools">
          <button class="search-trigger" aria-label="Search">⌕</button>
          <a href="account.html" class="icon-button account-link" aria-label="Account">
            <img src="assets/images/icon-toolbar/account-logo.png" alt="Account" width="22" height="22" />
          </a>
          <a href="index.html" class="icon-button home-link-mobile" aria-label="Go home">
            <img class="logo-image" src="assets/images/logo/football90-logo.png" alt="Football 90 home" width="22" height="22" />
          </a>
          <a href="wishlist.html" class="icon-button" aria-label="Wishlist">♡</a>
          <a href="cart.html" class="icon-button nav-cart" aria-label="Cart">
            <img src="assets/images/icon-toolbar/cart-logo.png" alt="Cart" width="28" height="28" />
            <span class="cart-count">0</span>
          </a>
          <button class="mobile-toggle icon-button" aria-label="Open menu">☰</button>
        </div>
      </div>
    </header>

    <div class="search-overlay" aria-hidden="true">
      <div class="search-panel" role="dialog" aria-modal="true">
        <div class="search-panel-header">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="Search jerseys, clubs, countries..." aria-label="Search jerseys" />
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>

    <main class="section">
      <div class="container">
        <div class="section-header">
          <div>
            <span class="eyebrow">Your bag</span>
            <h2>SHOPPING CART</h2>
          </div>
        </div>
        <div class="cart-wrap">
          <div class="cart-items" id="cartItems"></div>
          <aside class="summary-box">
            <h3>Order Summary</h3>
            <div class="summary-row"><span>Subtotal</span><strong id="subtotal">₱0</strong></div>
            <div class="summary-row"><span>Shipping</span><strong id="shipping">₱0</strong></div>
            <div class="summary-row total"><span>Total</span><strong id="total">₱0</strong></div>
            <a href="checkout.html" data-checkout-link class="btn btn-primary" style="width: 100%; margin-top: 16px;">PROCEED TO CHECKOUT</a>
          </aside>
        </div>
      </div>
    </main>

    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
